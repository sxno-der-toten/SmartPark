<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Carte des parkings</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>

<h2>Parkings en direct</h2>
<div id="map"></div>

<script>

// Création de la carte centrée sur Orléans
const map = L.map('map').setView([47.9025, 1.909], 13);

// Fond de carte OSM
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

// Icône verte = places disponibles connues
const greenIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

const orangeIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// Icône rouge = pas d'info / pas de places
const redIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// Gris très foncé (presque noir)
const darkGreyIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// Appel à ton PHP  
fetch("api.php")
    .then(r => r.json())
    .then(parkings => {
        parkings.forEach(p => {
            if (!p.lat || !p.lon) return;


            function getMarkerColor(places, capacity) {
            if (places === null || places === undefined) {
                return "darkgray"; // gris très foncé
            }

            if (places == 0) {
                return "red"; // plus aucune place
            }

            const ratio = places / capacity;

            if (ratio <= 0.2 ) {
                return "orange"; // ≤ 20% mais > 0
            }

            if (ratio >= 0.2) {
                return "green"; // reste > 20%
            }
            
            return "darkgray";
        }

        const color = getMarkerColor(p.nb_places_libres, p.nb_places);

        let iconToUse;
        switch (color) {
            case "green":    iconToUse = greenIcon; break;
            case "orange":   iconToUse = orangeIcon; break;
            case "red":      iconToUse = redIcon; break;
            case "darkgray": iconToUse = darkGreyIcon; break;
            default:         iconToUse = darkGreyIcon; break;
        }

        //Création du marker
        L.marker([p.lat, p.lon], { icon: iconToUse })
            .addTo(map)
            .bindPopup(`
                <b>${p.nom}</b><br>
                Places totales : ${p.nb_places ?? "?"}<br>
                Places libres : ${p.nb_places_libres ?? "?"}
            `);
        });
    })
   // .catch(err => console.log(err));
</script>

</body>
</html>
