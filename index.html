<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Carte des parkings</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>

<h2>Parkings en direct</h2>
<div id="map"></div>

<script>
// Création de la carte centrée sur Orléans
const map = L.map('map').setView([47.9025, 1.909], 13);

// Fond de carte OSM
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

// Appel à ton PHP
fetch("api.php")
    .then(r => r.json())
    .then(parkings => {
        parkings.forEach(p => {
            if (!p.lat || !p.lon) return;

            // Création d'un marker
            L.marker([p.lat, p.lon])
                .addTo(map)
                .bindPopup(`
                    <b>${p.nom}</b><br>
                    Places : ${p.nb_places}<br>
                    Libres : ${p.nb_places_libres}
                `);
        });
    })
    .catch(err => console.log(err));
</script>

</body>
</html>
